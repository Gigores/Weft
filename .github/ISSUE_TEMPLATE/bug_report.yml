name: Bug report
description: Something in Weft behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include what you were doing when you saw the bug.
    validations:
      required: true
