[package]
name = "weft_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
weft_abi.workspace = true
weft_noise.workspace = true
weft_render.workspace = true
winit.workspace = true
glam.workspace = true
bytemuck.workspace = true
log.workspace = true
rayon.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
libloading.workspace = true
lz4_flex.workspace = true
png.workspace = true
rustc-hash.workspace = true
iroh.workspace = true
tokio.workspace = true
zip.workspace = true
kira.workspace = true
serde_json.workspace = true
mimalloc.workspace = true

[dev-dependencies]
naga.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# NativeActivity: no Java of our own to build.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }

# Android's clipboard is only reached through Java.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard.workspace = true
