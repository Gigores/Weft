[package]
name = "weft_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
weft_abi.workspace = true
weft_noise.workspace = true
weft_render.workspace = true
winit.workspace = true
glam.workspace = true
parry3d-f64 = { version = "0.31.1", default-features = false, features = ["required-features", "std", "alloc"] }
bytemuck.workspace = true
log.workspace = true
rayon.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
libloading.workspace = true
lz4_flex.workspace = true
png.workspace = true
rustc-hash.workspace = true
iroh.workspace = true
tokio.workspace = true
zip.workspace = true
kira.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
sha2.workspace = true
mimalloc.workspace = true

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
naga.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# NativeActivity: no Java of our own to build.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard.workspace = true
